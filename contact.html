<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact GS</title>
    <link href="node_modules/bootstrap/dist/css/bootstrap.css" rel="stylesheet" />
</head>

<body>

    <!-- nav bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html"><span class="h3">Home</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contact.html"><span class="h3">Contact</span></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- hero image with logo -->
    <div>
        <img class="img-fluid" src="images/logo_with_bg_image.png">
    </div>

    <h2 class="container pt-5">Contact Us!</h2>
    <!-- table with hours, address, and phone number -->
    <table class="table container h5 mt-5">
        <thead>
            <tr>
                <th scope="col">Hours</th>
                <th scope="col">Address</th>
                <th scope="col">Phone</th>
            </tr>
        </thead>
        <tbody class="table-group-divider">
            <tr>
                <td scope="row">
                    <p>M - F: 7am - 10pm</p>
                    <p>Sa - Sun: 10am - 10pm</p>
                </td>
                <td>123 Main Street, Anywhere, USA 101010</td>
                <td>(555)-555-5555</td>
            </tr>   
        </tbody>
    </table>


   
<h4 class="container py-5">We want to know how we're doing and what we can do better as your local sandwich shop. Send us your feedback!</h4>
 <!-- feedback on service form -->
<form class="container">
  <div class="row mb-3">
    <label for="inputEmail3" class="col-sm-2 col-form-label">Name</label>
    <div class="col-sm-10">
      <input type="email" class="form-control" id="inputEmail3">
    </div>
  </div>
  <div class="row mb-3">
    <label for="inputPassword3" class="col-sm-2 col-form-label">Email</label>
    <div class="col-sm-10">
      <input type="password" class="form-control" id="inputPassword3">
    </div>
  </div>
  <div class="row mb-3">
    <label for="inputPassword3" class="col-sm-2 col-form-label">Feedback</label>
    <div class="col-sm-10">
      <input type="password" class="form-control" id="inputPassword3">
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Submit</button>
</form>
</body>

</html>
